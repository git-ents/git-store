[package]
name = "gix-store"
version = "0.1.0"
edition = "2024"

[dependencies]
facet-git-tree = { path = "../facet-git-tree", features = ["value"] }
facet-value = "0.50.0-rc.5"
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs"] }
thiserror = "2"

[dev-dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
tempfile = "3"
test-support = { path = "../test-support" }
