[package]
name = "gix-refstore"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[dependencies]
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs"] }
gix-hash = { version = "0.25.1", features = ["sha1"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }
