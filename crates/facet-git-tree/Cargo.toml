[package]
name = "facet-git-tree"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[features]
value = ["dep:facet-value"]

[dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
facet-value = { version = "0.50.0-rc.5", optional = true }
gix-hash = { version = "0.25.1", features = ["sha1"] }
gix-object = "0.62.0"
gix-odb = "0.82.0"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
facet-value = "0.50.0-rc.5"
proptest = "1"
rstest = "0.26"

[[test]]
name = "schema_driven"
required-features = ["value"]

[[test]]
name = "schema_write"
required-features = ["value"]
