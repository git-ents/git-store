[package]
name = "git-store"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "git-store"
path = "src/main.rs"

[dependencies]
gix-store = { path = "../gix-store" }
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
facet-git-tree = { path = "../facet-git-tree", features = ["value"] }
facet-value = "0.50.0-rc.5"
facet-json = "0.50.0-rc.5"
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
anyhow = "1"

[dev-dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
tempfile = "3"
test-support = { path = "../test-support" }
