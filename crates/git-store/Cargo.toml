[package]
name = "git-store"
version = "0.1.0"
edition = "2024"
readme = "README.adoc"

[[bin]]
name = "git-store"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:dialoguer",
    "dep:facet-json",
    "git-database/cli",
    "gix/interrupt",
    "gix/revision",
]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
facet = { workspace = true }
facet-git-tree = { workspace = true }
facet-json = { workspace = true, optional = true }
facet-value = { workspace = true }
git-database = { workspace = true, default-features = false, optional = true }
gix = { workspace = true, features = ["sha1", "zlib-rs"] }
gix-refstore = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
facet = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true }
