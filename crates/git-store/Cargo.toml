[package]
name = "git-store"
version = "0.1.0"
edition = "2024"
readme = "README.adoc"

[[bin]]
name = "git-store"
path = "src/main.rs"

[dependencies]
git-database = { workspace = true }
git-prolly = { workspace = true }
gix-store = { workspace = true }
facet = { workspace = true }
facet-git-tree = { workspace = true }
facet-value = { workspace = true }
facet-json = { workspace = true }
gix = { workspace = true, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { workspace = true }
dialoguer = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
facet = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true }
