[workspace]
members = ["crates/gix-refstore", "crates/gix-store", "crates/git-store", "crates/git-prolly", "crates/gix-database", "crates/test-support"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
dialoguer = { version = "0.12", default-features = false }
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }
facet-git-tree = { git = "https://github.com/git-ents/facet-git-tree", features = ["value"] }
facet-json = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
git-prolly = { path = "crates/git-prolly" }
gix = { version = "0.85.0", default-features = false }
gix-database = { path = "crates/gix-database" }
gix-hash = { version = "0.25.1", features = ["sha1"] }
gix-refstore = { path = "crates/gix-refstore" }
gix-store = { path = "crates/gix-store" }
tempfile = "3"
test-support = { path = "crates/test-support" }
thiserror = "2"
